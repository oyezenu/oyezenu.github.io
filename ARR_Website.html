<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ARR Construction — BuildBooks</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet"/>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #f7f7f5; font-family: 'DM Sans', sans-serif; color: #3a3a32; }
    input, select, textarea, button { font-family: 'DM Sans', sans-serif; }
    input:focus, select:focus, textarea:focus {
      border-color: #6AB52A !important;
      box-shadow: 0 0 0 3px rgba(106,181,42,.15) !important;
      outline: none;
    }
    @keyframes arrSlide {
      from { opacity:0; transform:translateX(-50%) translateY(10px); }
      to   { opacity:1; transform:translateX(-50%) translateY(0); }
    }
    @keyframes fadeIn {
      from { opacity:0; }
      to   { opacity:1; }
    }
    @media(max-width:620px) {
      .arr-nl { display:none !important; }
      .arr-grid { grid-template-columns: 1fr 1fr !important; }
      .arr-hide-mobile { display:none !important; }
    }
    ::-webkit-scrollbar { width:6px; }
    ::-webkit-scrollbar-track { background:#f0f0ee; }
    ::-webkit-scrollbar-thumb { background:#c8c8c0; border-radius:3px; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    /* ── constants ── */
    const CATS = [
      "Materials & Supplies","Labor / Subcontractors","Tools & Equipment",
      "Travel / Gas","Office Expenses","WiFi / Internet",
      "Insurance","Permits & Licenses","Gifts & Employee Perks","Miscellaneous"
    ];
    const STATUSES = ["Pending","In Progress","Completed","Invoiced","Paid"];
    const SK = "arr_buildbooks_v1";

    /* ── helpers ── */
    const uid  = () => Math.random().toString(36).slice(2,10);
    const mkRef = () => {
      const c = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
      let r = "REF-";
      for(let i=0;i<6;i++) r += c[(Math.random()*c.length)|0];
      return r;
    };
    const fmt   = n => new Intl.NumberFormat("en-US",{style:"currency",currency:"USD"}).format(n||0);
    const fDate = d => { if(!d) return ""; return new Date(d+"T00:00:00").toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"}); };
    const today = () => new Date().toISOString().split("T")[0];
    const load  = () => { try { const r=localStorage.getItem(SK); return r?JSON.parse(r):null; } catch{return null;} };
    const save  = d  => { try { localStorage.setItem(SK,JSON.stringify(d)); } catch{} };

    /* ── brand colors ── */
    const G1="#6AB52A", G2="#78B833", G3="#5A9E22";
    const GRAD=`linear-gradient(135deg,${G1},${G2})`;
    const CARD="#ffffff", BORDER="#e8e8e4";
    const TEXT="#3a3a32", TEXT2="#6b6b60", TEXT3="#9a9a8e";
    const RED="#c0392b", BLUE="#2980b9", REVEN="#2d8a4e";

    /* ── shared styles ── */
    const inputSt = {
      width:"100%", padding:"10px 12px", background:"#fafaf8",
      border:`1px solid ${BORDER}`, borderRadius:8, color:TEXT,
      fontSize:14, outline:"none", transition:"border-color .2s"
    };
    const btnP = {
      padding:"10px 22px", background:GRAD, color:"#fff", border:"none",
      borderRadius:8, fontSize:14, fontWeight:600, cursor:"pointer",
      boxShadow:"0 2px 8px rgba(106,181,42,.3)", transition:"opacity .15s"
    };
    const btnD = { padding:"10px 18px", background:RED, color:"#fff", border:"none", borderRadius:8, fontSize:14, fontWeight:600, cursor:"pointer" };
    const btnG = {
      padding:"8px 16px", background:"transparent", border:`1px solid ${BORDER}`,
      borderRadius:8, color:TEXT2, fontSize:13, cursor:"pointer", transition:"all .2s"
    };

    /* ── tiny components ── */
    function Field({label,children}){
      return(
        <div style={{marginBottom:14}}>
          <label style={{display:"block",fontSize:11,color:TEXT2,marginBottom:5,textTransform:"uppercase",letterSpacing:1.2,fontWeight:600}}>{label}</label>
          {children}
        </div>
      );
    }

    function Modal({open,onClose,title,children}){
      if(!open) return null;
      return(
        <div onClick={onClose} style={{position:"fixed",inset:0,zIndex:999,display:"flex",alignItems:"center",justifyContent:"center",background:"rgba(0,0,0,.42)",padding:16,animation:"fadeIn .2s"}}>
          <div onClick={e=>e.stopPropagation()} style={{background:CARD,border:`1px solid ${BORDER}`,borderRadius:12,width:"100%",maxWidth:520,maxHeight:"92vh",overflowY:"auto",padding:28,boxShadow:"0 24px 64px rgba(0,0,0,.18)"}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:22}}>
              <h3 style={{margin:0,fontSize:19,color:TEXT,fontFamily:"'Playfair Display',serif",fontWeight:700}}>{title}</h3>
              <button onClick={onClose} style={{background:"none",border:"none",color:TEXT3,fontSize:24,cursor:"pointer",lineHeight:1,padding:"0 4px"}}>✕</button>
            </div>
            {children}
          </div>
        </div>
      );
    }

    function StatusBadge({status}){
      const c = status==="Paid"?REVEN:status==="Completed"||status==="Invoiced"?G1:status==="In Progress"?BLUE:TEXT3;
      return <span style={{display:"inline-block",padding:"3px 12px",borderRadius:20,fontSize:11,fontWeight:600,background:`${c}18`,color:c}}>{status}</span>;
    }

    function SectionHeader({title}){
      return(
        <div style={{borderLeft:`3px solid ${G1}`,paddingLeft:16,marginBottom:14}}>
          <h3 style={{fontSize:18,color:TEXT,margin:0,fontFamily:"'Playfair Display',serif",fontWeight:700}}>{title}</h3>
        </div>
      );
    }

    function EmptyState({msg}){
      return <div style={{textAlign:"center",padding:52,color:TEXT3,background:CARD,borderRadius:10,border:`1px solid ${BORDER}`}}>{msg}</div>;
    }

    /* ── forms ── */
    function JobForm({job,onSave,onDelete}){
      const [f,setF] = useState(job||{name:"",client:"",company:"",address:"",city:"",state:"TX",zip:"",date:today(),revenue:"",status:"Pending",notes:""});
      const set=(k,v)=>setF(p=>({...p,[k]:v}));
      const submit=()=>{ if(!f.name.trim()) return; onSave({...f,revenue:parseFloat(f.revenue)||0}); };
      return(
        <div>
          <Field label="Job Name *"><input style={inputSt} value={f.name} onChange={e=>set("name",e.target.value)} placeholder="e.g. Kitchen Remodel – Smith Residence"/></Field>
          <Field label="Client Name"><input style={inputSt} value={f.client} onChange={e=>set("client",e.target.value)} placeholder="e.g. John Smith"/></Field>
          <Field label="Company / Property Name"><input style={inputSt} value={f.company} onChange={e=>set("company",e.target.value)} placeholder="e.g. Smith Residence or ABC Corp"/></Field>
          <Field label="Street Address"><input style={inputSt} value={f.address} onChange={e=>set("address",e.target.value)} placeholder="e.g. 1234 Oak Street"/></Field>
          <div style={{display:"grid",gridTemplateColumns:"2fr 1fr 1fr",gap:12}}>
            <Field label="City"><input style={inputSt} value={f.city} onChange={e=>set("city",e.target.value)} placeholder="Houston"/></Field>
            <Field label="State"><input style={inputSt} value={f.state} onChange={e=>set("state",e.target.value)} placeholder="TX"/></Field>
            <Field label="ZIP"><input style={inputSt} value={f.zip} onChange={e=>set("zip",e.target.value)} placeholder="77001"/></Field>
          </div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
            <Field label="Job Date"><input type="date" style={inputSt} value={f.date} onChange={e=>set("date",e.target.value)}/></Field>
            <Field label="Revenue ($)"><input type="number" step="0.01" style={inputSt} value={f.revenue} onChange={e=>set("revenue",e.target.value)} placeholder="0.00"/></Field>
          </div>
          <Field label="Status">
            <select style={inputSt} value={f.status} onChange={e=>set("status",e.target.value)}>
              {STATUSES.map(s=><option key={s}>{s}</option>)}
            </select>
          </Field>
          <Field label="Notes / Description">
            <textarea style={{...inputSt,minHeight:75,resize:"vertical"}} value={f.notes} onChange={e=>set("notes",e.target.value)} placeholder="Additional notes about this job..."/>
          </Field>
          <div style={{display:"flex",gap:8,marginTop:12,flexWrap:"wrap"}}>
            <button onClick={submit} style={btnP}>{job?"Save Changes":"Add Job"}</button>
            {onDelete && <button onClick={onDelete} style={btnD}>Delete Job</button>}
          </div>
        </div>
      );
    }

    function ExpenseForm({expense,jobs,prefill,onSave,onDelete}){
      const prefillDate = prefill?.jobId ? (jobs.find(j=>j.id===prefill.jobId)?.date||today()) : today();
      const [f,setF] = useState(expense||{description:"",amount:"",category:CATS[0],date:prefillDate,jobId:prefill?.jobId||"",vendor:"",notes:""});
      const set=(k,v)=>setF(p=>({...p,[k]:v}));
      const submit=()=>{ if(!f.description.trim()) return; onSave({...f,amount:parseFloat(f.amount)||0}); };
      return(
        <div>
          <Field label="Description *"><input style={inputSt} value={f.description} onChange={e=>set("description",e.target.value)} placeholder="e.g. Lumber – Home Depot"/></Field>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
            <Field label="Amount ($)"><input type="number" step="0.01" style={inputSt} value={f.amount} onChange={e=>set("amount",e.target.value)} placeholder="0.00"/></Field>
            <Field label="Date"><input type="date" style={inputSt} value={f.date} onChange={e=>set("date",e.target.value)}/></Field>
          </div>
          <Field label="Category">
            <select style={inputSt} value={f.category} onChange={e=>set("category",e.target.value)}>
              {CATS.map(c=><option key={c}>{c}</option>)}
            </select>
          </Field>
          <Field label="Link to Job (optional)">
            <select style={inputSt} value={f.jobId} onChange={e=>set("jobId",e.target.value)}>
              <option value="">— General / Overhead (not job-specific) —</option>
              {jobs.map(j=><option key={j.id} value={j.id}>{j.name} ({j.refNum})</option>)}
            </select>
          </Field>
          <Field label="Vendor / Supplier"><input style={inputSt} value={f.vendor} onChange={e=>set("vendor",e.target.value)} placeholder="e.g. Home Depot, Lowe's, Amazon"/></Field>
          <Field label="Notes">
            <textarea style={{...inputSt,minHeight:60,resize:"vertical"}} value={f.notes} onChange={e=>set("notes",e.target.value)} placeholder="Optional notes..."/>
          </Field>
          <div style={{display:"flex",gap:8,marginTop:12,flexWrap:"wrap"}}>
            <button onClick={submit} style={btnP}>{expense?"Save Changes":"Add Expense"}</button>
            {onDelete && <button onClick={onDelete} style={btnD}>Delete Expense</button>}
          </div>
        </div>
      );
    }

    /* ══════════════════ MAIN APP ══════════════════ */
    function App(){
      const [data,setData]   = useState(()=>load()||{jobs:[],expenses:[]});
      const [view,setView]   = useState("dashboard");
      const [modal,setModal] = useState(null);
      const [search,setSearch] = useState("");
      const [toast,setToast] = useState("");
      const [selYear,setSelYear] = useState(()=>new Date().getFullYear().toString());

      useEffect(()=>{ save(data); },[data]);
      const showToast = msg => { setToast(msg); setTimeout(()=>setToast(""),2600); };

      /* data ops */
      const addJob     = j => { setData(d=>({...d,jobs:[{...j,id:uid(),refNum:mkRef(),createdAt:today()},...d.jobs]})); showToast("✓ Job added"); };
      const updateJob  = j => { setData(d=>({...d,jobs:d.jobs.map(x=>x.id===j.id?j:x)})); showToast("✓ Job updated"); };
      const deleteJob  = id=> { setData(d=>({...d,jobs:d.jobs.filter(x=>x.id!==id),expenses:d.expenses.filter(x=>x.jobId!==id)})); showToast("Job deleted"); };
      const addExp     = e => { setData(d=>({...d,expenses:[{...e,id:uid(),refNum:mkRef(),createdAt:today()},...d.expenses]})); showToast("✓ Expense added"); };
      const updateExp  = e => { setData(d=>({...d,expenses:d.expenses.map(x=>x.id===e.id?e:x)})); showToast("✓ Expense updated"); };
      const deleteExp  = id=> { setData(d=>({...d,expenses:d.expenses.filter(x=>x.id!==id)})); showToast("Expense deleted"); };

      /* computed */
      const stats = useMemo(()=>{
        const tr=data.jobs.reduce((s,j)=>s+(j.revenue||0),0);
        const te=data.expenses.reduce((s,e)=>s+(e.amount||0),0);
        return {tr,te,profit:tr-te,jc:data.jobs.length};
      },[data]);

      const sr = useMemo(()=>{
        if(!search.trim()) return {j:[],e:[]};
        const q=search.toLowerCase().trim();
        return {
          j:data.jobs.filter(j=>j.refNum.toLowerCase().includes(q)||j.name.toLowerCase().includes(q)||(j.client||"").toLowerCase().includes(q)||(j.notes||"").toLowerCase().includes(q)),
          e:data.expenses.filter(e=>e.refNum.toLowerCase().includes(q)||e.description.toLowerCase().includes(q)||e.category.toLowerCase().includes(q)||(e.vendor||"").toLowerCase().includes(q))
        };
      },[search,data]);

      const jobFor  = id => data.jobs.find(j=>j.id===id);
      const expsFor = id => data.expenses.filter(e=>e.jobId===id);

      const hover=(e,on)=>{
        e.currentTarget.style.borderColor = on?G1:BORDER;
        e.currentTarget.style.boxShadow   = on?`0 3px 14px rgba(106,181,42,.1)`:"0 1px 4px rgba(0,0,0,.04)";
      };

      /* ── reports data ── */
      const reports = useMemo(()=>{
        const totalRev=stats.tr, totalExp=stats.te, netProfit=stats.profit;
        const avgMargin=totalRev>0?(netProfit/totalRev)*100:0;
        const jobPL=data.jobs.map(j=>{
          const costs=data.expenses.filter(e=>e.jobId===j.id).reduce((s,e)=>s+(e.amount||0),0);
          const profit=(j.revenue||0)-costs;
          const margin=(j.revenue||0)>0?(profit/(j.revenue||0))*100:0;
          return {...j,costs,profit,margin};
        }).sort((a,b)=>b.margin-a.margin);
        const byCat={};
        data.expenses.forEach(e=>{ byCat[e.category]=(byCat[e.category]||0)+(e.amount||0); });
        const catData=Object.entries(byCat).sort((a,b)=>b[1]-a[1]);
        const monthlyMap={};
        data.expenses.forEach(e=>{ if(!e.date)return; const k=e.date.substring(0,7); monthlyMap[k]=(monthlyMap[k]||0)+(e.amount||0); });
        const monthly=Object.entries(monthlyMap).sort((a,b)=>a[0].localeCompare(b[0])).slice(-12);
        return {totalRev,totalExp,netProfit,avgMargin,jobPL,catData,monthly};
      },[data,stats]);

      /* ── insights engine ── */
      const insights = useMemo(()=>{
        const cards=[];
        const {totalRev,totalExp,avgMargin,jobPL,catData,monthly}=reports;
        if(totalRev>0){
          if(avgMargin<20) cards.push({type:"warning",title:"Low Profit Margin",body:`Your overall margin is ${avgMargin.toFixed(1)}%. Construction industry standard is 20–35%. Review job pricing or reduce costs.`});
          else if(avgMargin>35) cards.push({type:"success",title:"Strong Profit Margin",body:`Your overall margin is ${avgMargin.toFixed(1)}% — above the 35% benchmark. Excellent pricing discipline.`});
          else cards.push({type:"tip",title:"Healthy Margin",body:`Your margin is ${avgMargin.toFixed(1)}%, within the healthy 20–35% range for Houston construction.`});
        }
        if(avgMargin>5&&totalRev>0){
          const safeDiscount=Math.max(0,avgMargin-20).toFixed(1);
          cards.push({type:"tip",title:"Safe Discount Range",body:`You can offer up to ${safeDiscount}% discount and still maintain a 20% minimum margin. Never go below that threshold on bids.`});
        }
        if(totalExp>0){
          const matAmt=catData.find(([c])=>c==="Materials & Supplies")?.[1]||0;
          const labAmt=catData.find(([c])=>c==="Labor / Subcontractors")?.[1]||0;
          if(matAmt/totalExp>0.5) cards.push({type:"warning",title:"High Materials Spend",body:`Materials & Supplies are ${((matAmt/totalExp)*100).toFixed(0)}% of total expenses — above the 50% threshold. Consider bulk purchasing or renegotiating supplier rates.`});
          if(labAmt/totalExp>0.4) cards.push({type:"warning",title:"High Labor Cost",body:`Labor / Subcontractors are ${((labAmt/totalExp)*100).toFixed(0)}% of expenses — above 40%. Review subcontractor rates or watch for scope creep.`});
        }
        if(monthly.length>=2){
          const prev=monthly[monthly.length-2][1], curr=monthly[monthly.length-1][1];
          if(prev>0){ const change=((curr-prev)/prev)*100; if(change>20) cards.push({type:"warning",title:"Spending Spike",body:`Expenses rose ${change.toFixed(0)}% month-over-month (${monthly[monthly.length-2][0]} → ${monthly[monthly.length-1][0]}). Investigate what drove the increase.`}); }
        }
        if(totalRev>0){
          const overhead=data.expenses.filter(e=>!e.jobId).reduce((s,e)=>s+(e.amount||0),0);
          const ratio=(overhead/totalRev)*100;
          if(ratio>15) cards.push({type:"warning",title:"High Overhead Ratio",body:`General overhead (not tied to jobs) is ${ratio.toFixed(1)}% of revenue. Target is below 15% for efficient construction operations.`});
          else if(overhead>0) cards.push({type:"success",title:"Overhead Under Control",body:`Overhead is ${ratio.toFixed(1)}% of revenue — within the healthy <15% benchmark.`});
        }
        const ranked=jobPL.filter(j=>(j.revenue||0)>0);
        if(ranked.length>0){
          const best=ranked[0];
          cards.push({type:"success",title:`Best Job: ${best.name}`,body:`${best.margin.toFixed(1)}% margin — ${fmt(best.profit)} profit on ${fmt(best.revenue)} revenue. Use this as a pricing benchmark.`});
          if(ranked.length>1){ const worst=ranked[ranked.length-1]; if(worst.margin<20) cards.push({type:"warning",title:`Low Margin: ${worst.name}`,body:`${worst.margin.toFixed(1)}% margin — below the 20% minimum. Review pricing strategy for similar future jobs.`}); }
        }
        return cards;
      },[reports,data]);

      /* ── yearly summary ── */
      const yearlySummary = useMemo(()=>{
        const allYears=new Set();
        data.jobs.forEach(j=>{if(j.date)allYears.add(j.date.substring(0,4));});
        data.expenses.forEach(e=>{if(e.date)allYears.add(e.date.substring(0,4));});
        const years=[...allYears].sort().reverse();
        const getYearData=(yr)=>{
          const yJobs=data.jobs.filter(j=>j.date&&j.date.startsWith(yr));
          const yExps=data.expenses.filter(e=>e.date&&e.date.startsWith(yr));
          const revenue=yJobs.reduce((s,j)=>s+(j.revenue||0),0);
          const expenses=yExps.reduce((s,e)=>s+(e.amount||0),0);
          const profit=revenue-expenses;
          const margin=revenue>0?(profit/revenue)*100:0;
          const MNAMES=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
          const monthly=MNAMES.map((name,idx)=>{
            const mo=String(idx+1).padStart(2,"0");
            const pfx=`${yr}-${mo}`;
            const moRev=data.jobs.filter(j=>j.date&&j.date.startsWith(pfx)).reduce((s,j)=>s+(j.revenue||0),0);
            const moExp=data.expenses.filter(e=>e.date&&e.date.startsWith(pfx)).reduce((s,e)=>s+(e.amount||0),0);
            return {name,moRev,moExp,profit:moRev-moExp};
          });
          const top5Jobs=[...yJobs].sort((a,b)=>(b.revenue||0)-(a.revenue||0)).slice(0,5);
          const catMap={};
          yExps.forEach(e=>{catMap[e.category]=(catMap[e.category]||0)+(e.amount||0);});
          const top5Cats=Object.entries(catMap).sort((a,b)=>b[1]-a[1]).slice(0,5);
          return {revenue,expenses,profit,margin,monthly,top5Jobs,top5Cats};
        };
        return {years,getYearData};
      },[data]);

      /* ── estimate generator ── */
      const generateEstimate = (job) => {
        const exps=data.expenses.filter(e=>e.jobId===job.id);
        const materials=exps.filter(e=>e.category==="Materials & Supplies");
        const labor=exps.filter(e=>e.category==="Labor / Subcontractors");
        const other=exps.filter(e=>e.category!=="Materials & Supplies"&&e.category!=="Labor / Subcontractors");
        const rev=job.revenue||0;
        const esc=s=>(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
        const logoSm=`<div style="display:flex;flex-direction:column;gap:2px"><div style="display:flex;gap:2px"><div style="width:5px;height:16px;border-radius:2px;background:#6AB52A;transform:rotate(-25deg)"></div><div style="width:5px;height:16px;border-radius:2px;background:#78B833;transform:rotate(-25deg)"></div><div style="width:5px;height:16px;border-radius:2px;background:#5A9E22;transform:rotate(-25deg)"></div></div><div style="display:flex;gap:2px;margin-top:-8px;margin-left:5px"><div style="width:5px;height:16px;border-radius:2px;background:#6AB52A;transform:rotate(-25deg)"></div><div style="width:5px;height:16px;border-radius:2px;background:#78B833;transform:rotate(-25deg)"></div><div style="width:5px;height:16px;border-radius:2px;background:#5A9E22;transform:rotate(-25deg)"></div></div></div>`;
        const pgHdr=(pg)=>`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:48px;padding-bottom:20px;border-bottom:2px solid #e8e8e4;"><div style="display:flex;align-items:center;gap:10px;">${logoSm}<div><div style="font-size:16px;font-weight:800;letter-spacing:1.5px;color:#3a3a32;">ARR</div><div style="font-size:9px;color:#9a9a8e;text-transform:uppercase;letter-spacing:3px;">Construction</div></div></div><div style="font-size:12px;color:#9a9a8e;">${esc(pg)} · ${esc(job.refNum)}</div></div>`;
        const liRows=(arr)=>arr.map(e=>`<tr><td style="padding:11px 14px;font-size:13px;border-bottom:1px solid #f0f0ee;color:#3a3a32;">${esc(e.description)}${e.vendor?` <span style="font-size:11px;color:#9a9a8e;">(${esc(e.vendor)})</span>`:""}</td><td style="padding:11px 14px;text-align:right;font-size:13px;border-bottom:1px solid #f0f0ee;">1</td><td style="padding:11px 14px;text-align:right;font-size:13px;border-bottom:1px solid #f0f0ee;">${fmt(e.amount)}</td><td style="padding:11px 14px;text-align:right;font-size:13px;border-bottom:1px solid #f0f0ee;font-weight:600;">${fmt(e.amount)}</td></tr>`).join("");

                              </div>
                              <div style={{background:CARD,border:`1px solid ${BORDER}`,borderRadius:10,overflow:"hidden"}}>
                                <table style={{width:"100%",borderCollapse:"collapse",fontSize:13}}>
                                  <thead>
                                    <tr style={{background:"#f7f7f5",borderBottom:`2px solid ${BORDER}`}}>
                                      {["Metric",prevYear,curYear,"Change"].map((h,hi)=>(
                                        <th key={hi} style={{padding:"10px 16px",textAlign:hi===0?"left":"right",fontSize:11,color:hi===2?TEXT:TEXT2,textTransform:"uppercase",letterSpacing:1.2,fontWeight:hi===2?700:600}}>{h}</th>
                                      ))}
                                    </tr>
                                  </thead>
                                  <tbody>
                                    {[
                                      {l:"Revenue",prev:prevYd.revenue,curr:yd.revenue,fmtFn:fmt,good:"up"},
                                      {l:"Expenses",prev:prevYd.expenses,curr:yd.expenses,fmtFn:fmt,good:"down"},
                                      {l:"Net Profit",prev:prevYd.profit,curr:yd.profit,fmtFn:fmt,good:"up"},
                                      {l:"Profit Margin",prev:prevYd.margin,curr:yd.margin,fmtFn:v=>`${v.toFixed(1)}%`,good:"up"},
                                    ].map((row,i)=>{
                                      const diff=row.curr-row.prev;
                                      const pctChange=row.prev!==0?((diff/Math.abs(row.prev))*100):null;
                                      const isGood=(row.good==="up"&&diff>0)||(row.good==="down"&&diff<0);
                                      const isNeutral=diff===0;
                                      const chColor=isNeutral?TEXT3:isGood?G1:RED;
                                      const arrow=diff>0?"↑":diff<0?"↓":"→";
                                      return(
                                        <tr key={row.l} style={{borderBottom:`1px solid ${BORDER}`,background:i%2===0?CARD:"#fafaf8"}}>
                                          <td style={{padding:"11px 16px",fontWeight:600,color:TEXT}}>{row.l}</td>
                                          <td style={{padding:"11px 16px",textAlign:"right",color:TEXT2}}>{row.fmtFn(row.prev)}</td>
                                          <td style={{padding:"11px 16px",textAlign:"right",fontWeight:700,color:TEXT}}>{row.fmtFn(row.curr)}</td>
                                          <td style={{padding:"11px 16px",textAlign:"right"}}>
                                            <span style={{display:"inline-flex",alignItems:"center",gap:3,padding:"3px 10px",borderRadius:20,fontSize:12,fontWeight:700,background:`${chColor}18`,color:chColor}}>
                                              {arrow} {pctChange!==null?`${Math.abs(pctChange).toFixed(1)}%`:"N/A"}
                                            </span>
                                          </td>
                                        </tr>
                                      );
                                    })}
                                  </tbody>
                                </table>
                              </div>
                            </div>
                          )}
                        </>
                      }
                    </div>
                  );
                })()}
              </div>
            )}

            {/* ═══ INSIGHTS ═══ */}
            {view==="insights" && (
              <div>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:22,flexWrap:"wrap",gap:12}}>
                  <h2 style={{margin:0,fontFamily:"'Playfair Display',serif",fontSize:30,color:TEXT,fontWeight:700}}>Insights</h2>
                  <div style={{fontSize:12,color:TEXT2,background:CARD,border:`1px solid ${BORDER}`,borderRadius:8,padding:"7px 14px"}}>
                    Based on construction industry benchmarks · Houston TX
                  </div>
                </div>
                {insights.length===0
                  ? <EmptyState msg="Add jobs and expenses to generate business insights"/>
                  : <div style={{display:"flex",flexDirection:"column",gap:12}}>
                    {insights.map((ins,i)=>{
                      const cfg={
                        warning:{bg:"#fff5f5",border:RED,icon:"⚠",tc:RED},
                        tip:{bg:"#fffbf0",border:"#e67e22",icon:"💡",tc:"#c0680f"},
                        success:{bg:"#f2fff5",border:G1,icon:"✓",tc:G3},
                      }[ins.type];
                      return(
                        <div key={i} style={{background:cfg.bg,border:`1px solid ${cfg.border}33`,borderLeft:`4px solid ${cfg.border}`,borderRadius:10,padding:"16px 20px",display:"flex",gap:14,alignItems:"flex-start"}}>
                          <div style={{fontSize:20,flexShrink:0,marginTop:1,color:cfg.tc}}>{cfg.icon}</div>
                          <div>
                            <div style={{fontWeight:700,fontSize:15,color:cfg.tc,marginBottom:5}}>{ins.title}</div>
                            <div style={{fontSize:13,color:TEXT,lineHeight:1.65}}>{ins.body}</div>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                }
              </div>
            )}
          </main>

          {/* ── FOOTER ── */}
          <footer style={{background:GRAD,padding:"16px 20px",display:"flex",justifyContent:"center",alignItems:"center",gap:28,flexWrap:"wrap",flexShrink:0}}>
            <span style={{color:"#fff",fontSize:13,fontWeight:700,letterSpacing:.5}}>ARR Construction</span>
            <span style={{color:"#ffffffaa",fontSize:12}}>BuildBooks · Internal Finance Dashboard</span>
            <span style={{color:"#ffffffaa",fontSize:12}}>Houston, Texas</span>
          </footer>

          {/* ══ MODALS ══ */}
          <Modal open={modal?.type==="addJob"||modal?.type==="editJob"} onClose={()=>setModal(null)} title={modal?.type==="editJob"?"Edit Job":"New Job"}>
            <JobForm job={modal?.item}
              onSave={j=>{modal?.type==="editJob"?updateJob(j):addJob(j);setModal(null);}}
              onDelete={modal?.type==="editJob"?()=>{deleteJob(modal.item.id);setModal(null);}:null}/>
          </Modal>

          <Modal open={modal?.type==="viewJob"} onClose={()=>setModal(null)} title="Job Details">
            {modal?.item && (
              <div>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:16,flexWrap:"wrap",gap:8}}>
                  <div>
                    <div style={{fontSize:22,fontWeight:700,color:TEXT,fontFamily:"'Playfair Display',serif",marginBottom:4}}>{modal.item.name}</div>
                    <div style={{fontSize:12,color:TEXT3,fontFamily:"monospace",background:"#f4f4f0",display:"inline-block",padding:"2px 8px",borderRadius:4}}>{modal.item.refNum}</div>
                  </div>
                  <StatusBadge status={modal.item.status}/>
                </div>
                {(modal.item.client||modal.item.company||modal.item.address) && (
                  <div style={{margin:"0 0 12px",fontSize:14,color:TEXT2,lineHeight:1.7}}>
                    {modal.item.client && <div><strong style={{color:TEXT}}>{modal.item.client}</strong></div>}
                    {modal.item.company && <div>{modal.item.company}</div>}
                    {modal.item.address && <div style={{color:TEXT3,fontSize:13}}>{modal.item.address}{(modal.item.city||modal.item.state||modal.item.zip)?`, ${[modal.item.city,modal.item.state].filter(Boolean).join(", ")}${modal.item.zip?" "+modal.item.zip:""}`:""}</div>}
                  </div>
                )}
                {modal.item.date   && <p style={{margin:"0 0 10px",fontSize:14,color:TEXT2}}>Date: {fDate(modal.item.date)}</p>}
                <div style={{fontSize:22,color:REVEN,fontWeight:700,marginBottom:8}}>Revenue: {fmt(modal.item.revenue)}</div>
                {modal.item.notes && <div style={{fontSize:13,color:TEXT2,marginBottom:16,padding:12,background:"#f7f7f5",borderRadius:8,borderLeft:`3px solid ${G1}`,lineHeight:1.6}}>{modal.item.notes}</div>}

                <div style={{borderTop:`1px solid ${BORDER}`,paddingTop:16,marginTop:8}}>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
                    <h4 style={{margin:0,fontSize:15,color:TEXT,fontFamily:"'Playfair Display',serif"}}>Job Expenses</h4>
                    <button onClick={()=>setModal({type:"addExpense",prefill:{jobId:modal.item.id}})} style={{...btnG,fontSize:12,padding:"5px 12px"}}>+ Add Expense</button>
                  </div>
                  {expsFor(modal.item.id).length===0
                    ? <div style={{fontSize:13,color:TEXT3,padding:16,textAlign:"center",background:"#fafaf8",borderRadius:6}}>No expenses linked to this job yet</div>
                    : <div style={{display:"flex",flexDirection:"column",gap:5}}>
                      {expsFor(modal.item.id).map(e=>(
                        <div key={e.id} onClick={ev=>{ev.stopPropagation();setModal({type:"editExpense",item:e});}}
                          style={{display:"flex",justifyContent:"space-between",padding:"10px 12px",background:"#fafaf8",borderRadius:6,cursor:"pointer",fontSize:13,borderLeft:`3px solid ${RED}`,transition:"background .15s"}}
                          onMouseEnter={ev=>ev.currentTarget.style.background="#f0f0ec"}
                          onMouseLeave={ev=>ev.currentTarget.style.background="#fafaf8"}>
                          <div>
                            <span style={{color:TEXT,fontWeight:500}}>{e.description}</span>
                            <span style={{color:TEXT3,marginLeft:10,fontSize:11}}>{e.category}</span>
                          </div>
                          <span style={{color:RED,fontWeight:700}}>{fmt(e.amount)}</span>
                        </div>
                      ))}
                      <div style={{textAlign:"right",fontSize:15,fontWeight:700,color:RED,marginTop:10,paddingTop:10,borderTop:`1px solid ${BORDER}`}}>
                        Total Job Costs: {fmt(expsFor(modal.item.id).reduce((s,e)=>s+(e.amount||0),0))}
                      </div>
                      <div style={{textAlign:"right",fontSize:16,fontWeight:700,marginTop:4,
                        color:(modal.item.revenue||0)-expsFor(modal.item.id).reduce((s,e)=>s+(e.amount||0),0)>=0?G1:RED}}>
                        Net Profit: {fmt((modal.item.revenue||0)-expsFor(modal.item.id).reduce((s,e)=>s+(e.amount||0),0))}
                      </div>
                    </div>
                  }
                </div>
                <div style={{display:"flex",gap:8,marginTop:22,flexWrap:"wrap"}}>
                  <button onClick={()=>setModal({type:"editJob",item:modal.item})} style={btnP}>Edit Job</button>
                  <button onClick={()=>generateEstimate(modal.item)} style={{...btnG,borderColor:G1,color:G3,fontWeight:600}}>📄 Generate Estimate</button>
                  <button onClick={()=>{deleteJob(modal.item.id);setModal(null);}} style={btnD}>Delete Job</button>
                </div>
              </div>
            )}
          </Modal>

          <Modal open={modal?.type==="addExpense"||modal?.type==="editExpense"} onClose={()=>setModal(null)} title={modal?.type==="editExpense"?"Edit Expense":"New Expense"}>
            <ExpenseForm expense={modal?.item} jobs={data.jobs} prefill={modal?.prefill}
              onSave={e=>{modal?.type==="editExpense"?updateExp(e):addExp(e);setModal(null);}}
              onDelete={modal?.type==="editExpense"?()=>{deleteExp(modal.item.id);setModal(null);}:null}/>
          </Modal>

          {/* toast */}
          {toast && (
            <div style={{position:"fixed",bottom:26,left:"50%",transform:"translateX(-50%)",background:GRAD,color:"#fff",
              padding:"10px 30px",borderRadius:8,fontWeight:600,fontSize:14,zIndex:9999,
              boxShadow:"0 4px 20px rgba(106,181,42,.35)",animation:"arrSlide .3s ease",whiteSpace:"nowrap"}}>
              {toast}
            </div>
          )}
        </div>
      );
    }

    ReactDOM.render(<App/>, document.getElementById("root"));
  </script>
</body>
</html>
